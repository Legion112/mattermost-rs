name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A push that lands while an earlier run is still going makes that run's result
# meaningless, so cancel it. main is exempt: cancelling a main build loses the
# artifact for a commit that is already merged.
# A push to a branch supersedes the one before it; a push to main does not.
# Expressed through the *group* rather than through `cancel-in-progress`,
# because that input takes the expression's result as a string and a
# non-empty string is truthy -- so `${{ github.ref != 'refs/heads/main' }}`
# cancelled main's runs too, and every commit but the newest went unchecked.
# Giving each main commit a group of its own means there is never an
# in-progress run to cancel.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'branch' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation is a loss in CI and it poisons the cache.
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

# Every step below is a single command. Anything with logic in it is a task in
# the xtask crate, so that CI and a workstation run the same compiled code
# rather than CI running a shell transcription of it.
#
# Four jobs rather than one, because they are independent and a run costs
# what its slowest job costs rather than the sum of all of them. They are
# split along what they *build*, not along what they check: `lint` and
# `test` share `target/`, while `coverage` builds everything again with
# instrumenting rustflags and so can never reuse their artifacts. Putting
# those two in one job meant each one invalidating the other's cache.
#
# Each job keeps its own cache for the same reason -- a shared key would
# have four jobs writing one entry, and the instrumented artifacts would
# evict the ordinary ones every run.
jobs:
  lint:
    name: lint (fmt, clippy, deps, parity, audit)
    # Pinned, never ubuntu-latest: latest will roll to 26.04 and silently
    # change glibc, GTK and the .deb's dependency resolution. 24.04 is what
    # this project targets and what the maintainer runs.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # No toolchain action on purpose. rust-toolchain.toml pins 1.92.0 plus
      # rustfmt, clippy, llvm-tools-preview and the musl target, and rustup
      # installs all of it on the first cargo invocation. Letting the manifest
      # be the single source of truth removes a place for CI and the
      # workstation to drift apart.
      - name: install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-24.04-1.92.0-lint
          # PR branches read the cache but do not thrash it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: install system build dependencies
        run: cargo run -q -p xtask -- apt-deps

      - name: check the build environment
        run: cargo run -q -p xtask -- doctor

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # Asserts every workspace member is classified gated/ungated, and that no
      # gated crate can transitively reach tokio, reqwest, gtk4, glib, ksni,
      # zbus, rusqlite or bollard. That invariant is what makes 100% reachable.
      - run: cargo run -q -p xtask -- check-deps

      # Asserts the parity matrix tells the truth, and that docs/parity.md is
      # the file the matrix generates rather than one edited by hand.
      - run: cargo run -q -p xtask -- parity --check

      - uses: taiki-e/install-action@v2
        with: { tool: cargo-audit }
      # Assessed advisories live in .cargo/audit.toml with their reasoning;
      # `make audit` is the same command a developer runs locally.
      - run: make audit

  test:
    name: test (unit and property)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-24.04-1.92.0-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: install system build dependencies
        run: cargo run -q -p xtask -- apt-deps

      - run: cargo test --workspace --all-features --locked

  coverage:
    name: 100% gate on the gated crates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-24.04-1.92.0-cover
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: install system build dependencies
        run: cargo run -q -p xtask -- apt-deps

      - uses: taiki-e/install-action@v2
        with: { tool: cargo-llvm-cov }

      - name: 100% line coverage on the gated crates
        run: make cover-gate

      # `if: always()` alone does not make a step non-gating -- a failing step
      # still fails the job, so the label was a lie until continue-on-error
      # went on it. Found the honest way: this step turned the run red after an
      # earlier failure meant cargo-llvm-cov was never installed.
      - name: coverage report (whole workspace, informational, never gating)
        if: always()
        continue-on-error: true
        run: make cover-report

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-html
          path: target/llvm-cov/html
          retention-days: 14

  build:
    name: build release binary
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-24.04-1.92.0-build
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: install system build dependencies
        run: cargo run -q -p xtask -- apt-deps

      - run: cargo build --release --locked --bin mattermost-rs

      # Strips, asserts the binary reports the manifest's version, asserts it
      # links nothing out of Homebrew's prefix, builds the .deb and writes
      # SHA256SUMS. `--deb` here and not only in the release workflow, because
      # a packaging step that runs once a release is a packaging step that is
      # broken on the day it matters.
      - name: strip, smoke-test, package and checksum
        run: cargo run -q -p xtask -- package --out dist --deb

      # Reads the stanza back out of the built package and validates the
      # .desktop entry inside it -- the two things that are wrong in a
      # hand-made .deb and that nothing in the Rust tests can see.
      - name: inspect the package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          dpkg-deb --fsys-tarfile dist/*.deb | tar -xO ./usr/share/applications/dev.legion.mattermost_rs.desktop > entry.desktop
          desktop-file-validate entry.desktop

      - uses: actions/upload-artifact@v7
        with:
          name: mattermost-rs-linux-amd64
          path: dist/
          retention-days: 30
          if-no-files-found: error
