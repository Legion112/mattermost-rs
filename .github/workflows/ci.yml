name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A push that lands while an earlier run is still going makes that run's result
# meaningless, so cancel it. main is exempt: cancelling a main build loses the
# artifact for a commit that is already merged.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation is a loss in CI and it poisons the cache.
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: check (fmt, clippy, tests, 100% gate)
    # Pinned, never ubuntu-latest: latest will roll to 26.04 and silently
    # change glibc, GTK and the .deb's dependency resolution. 24.04 is what
    # this project targets and what the maintainer runs.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # No toolchain action on purpose. rust-toolchain.toml pins 1.92.0 plus
      # rustfmt, clippy, llvm-tools-preview and the musl target, and rustup
      # installs all of it on the first cargo invocation. Letting the manifest
      # be the single source of truth removes a place for CI and the
      # workstation to drift apart.
      - name: install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-24.04-1.92.0
          # PR branches read the cache but do not thrash it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # mm-gui has no GTK dependency yet -- it arrives in P1. Installing the
      # headers now is ~40s of cheap insurance: without this step, the commit
      # that adds `gtk4` to mm-gui turns the build red for a reason that has
      # nothing to do with that commit.
      - name: install system build dependencies
        run: ./scripts/apt-deps.sh

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

      # Asserts every workspace member is classified gated/ungated, and that no
      # gated crate can transitively reach tokio, reqwest, gtk4, glib, zbus,
      # rusqlite or bollard. That invariant is what makes 100% reachable.
      - run: cargo run -q -p xtask -- check-deps

      - uses: taiki-e/install-action@v2
        with: { tool: cargo-llvm-cov }

      - name: 100% line coverage on the gated crates
        run: make cover-gate

      - name: coverage report (whole workspace, informational, never gating)
        if: always()
        run: make cover-report

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-html
          path: target/llvm-cov/html
          retention-days: 14

      - uses: taiki-e/install-action@v2
        with: { tool: cargo-audit }
      - run: cargo audit --deny warnings

  build:
    name: build release binary
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-24.04-1.92.0
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ./scripts/apt-deps.sh

      - run: cargo build --release --locked --bin mattermost-rs

      - name: strip and smoke-test
        run: |
          set -o pipefail
          strip target/release/mattermost-rs
          ./target/release/mattermost-rs --version
          ldd target/release/mattermost-rs

      - name: collect artifacts
        run: |
          set -o pipefail
          mkdir -p dist
          cp target/release/mattermost-rs dist/
          cd dist && sha256sum ./* > SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: mattermost-rs-linux-amd64
          path: dist/
          retention-days: 30
          if-no-files-found: error
