# The parity matrix: what this client does, what it will do, and what it will
# never do. `docs/parity.md` is generated from this file.
#
# A client with no webview has a ceiling that is not about effort: Playbooks,
# Boards, the interactive Apps framework and every third-party plugin ship as
# web app code served by the server. This file is where that ceiling is stated
# out loud instead of being discovered.
#
# status:
#   done                  implemented and verified against a live server
#   partial               implemented, with the gap named in `notes`
#   planned               in scope, not built yet
#   wontfix               in scope for upstream, deliberately not for us
#   blocked-no-webview    impossible without a renderer we do not have
#
# A `done` row whose endpoints are not all present in mm_api::ROUTES fails CI.
# A `wontfix` or `blocked-no-webview` row without both `reason` and `fallback`
# fails CI. `verified_against` empty means NOT YET CONFIRMED against a real
# server, and the count of those is printed on every run.

[[feature]]
id       = "unread.channel_counts"
area     = "unread"
upstream = "server-api"
status   = "done"
endpoints = [
  "GET /api/v4/users/me/teams/{team_id}/channels/members",
  "POST /api/v4/channels/members/me/view",
]
ws_events        = ["channel_member_updated", "multiple_channels_viewed"]
verified_against = "12.0.1"
notes = """
Verified against a live Mattermost 12.0.1: a channel with 6 plain messages and \
1 mention reported 7 unread with a mention badge, while a muted channel \
reported its 3 unread without an unread marker and contributed nothing to the \
mention total. CollapsedThreads came back as always_on and the client switched \
itself to root-only counting. Still NOT verified at the edges: a muted channel \
holding a direct mention, DM channels, and the interaction with \
ignore_channel_mentions. That policy lives in the webapp's TypeScript \
selectors and wants a recorded trace rather than more reading.

A mention arriving live counts now too. The copy of a `posted` the server \
sends a mentioned reader names them in `mentions`, and the membership's \
own mention counter -- which the server moves without saying so -- is \
raised here the same way, so the badge appears with the message rather \
than with the next sync. Not for the reader's own message, and not twice \
for a frame replayed after a reconnect. Verified in the lab: a colleague's \
`@legion` in a channel not open put a 1 on its row, and opening the \
channel took it off here and left the server counting none. The "New messages" line \
never sits above the reader's own message either -- they were there when \
they wrote it, whatever the server's view time says -- which the lab's \
own sent message showed it doing. "Mark as unread" from the message menu \
is lab-verified: the server counted the channel unread from that message \
on, and coming back to the channel read it again."""

