[[feature]]
id       = "desktop.tray"
area     = "desktop"
upstream = "desktop"
status   = "planned"
verified_against = "GNOME Shell 46.0 / Ubuntu 24.04 / X11"
notes = """
De-risked ahead of P3: ubuntu-appindicators is enabled by default, the \
StatusNotifierWatcher is present with a registered host, and a real ksni item \
registers successfully. See docs/gtk-notes.md. Depends on that GNOME \
extension, so the implementation must detect an absent watcher and say so \
rather than publishing into the void."""
