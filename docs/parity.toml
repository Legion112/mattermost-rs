[[feature]]
id       = "desktop.tray"
area     = "desktop"
upstream = "desktop"
status   = "partial"
endpoints = []
verified_against = ""
notes = """
An icon in the tray with an Open/Quit menu, and **closing the window hides \
it there** rather than quitting -- so notifications keep arriving and the \
unread count keeps moving, which is the entire point of having one. Only \
when there is a tray: the engine tells the window whether an icon actually \
registered, because hiding with nowhere to click would put the application \
somewhere the reader cannot get it back from.

Two things had to be got right, neither obvious. GNOME 46 dropped \
`StatusNotifierItem` from the shell, so this needs an `AppIndicator` \
extension -- Ubuntu ships and enables one, which is the answer to the \
question phase zero left open. And the icon is served as **pixels, with no \
icon name at all**: a host given both prefers the name, resolves it against \
its own idea of the icon theme, fails to find an application installed under \
`~/.local/share/icons`, and draws three dots. Which is what it did, with a \
perfectly good pixmap sitting on the bus beside the name it could not \
resolve.

The menu has two entries and will not grow: a tray menu is reached by \
accident as often as on purpose, and everything on it is one slip from being \
clicked. Verified on this machine: the icon drew, closing the window left \
the process running with the icon in place, and Open brought it back. NOT \
built: an unread count drawn *on* the tray icon (it is in the tooltip, and \
on the dock icon -- see `desktop.badge`), and starting hidden."""

[[feature]]
id       = "auth.password_and_pat"
area     = "auth"
upstream = "server-api"
status   = "done"
endpoints = ["POST /api/v4/users/login", "GET /api/v4/users/me"]
verified_against = "12.0.1"
notes = """
The session token arrives in the Token response header, 26 characters, with \
the body carrying only the sanitized user -- confirmed on a live server. The \
MFA field is named `token`, not `mfa_token`. A personal access token is used \
identically via Authorization: Bearer."""

[[feature]]
id       = "auth.sso_desktop_token"
area     = "auth"
upstream = "server-api"
status   = "planned"
endpoints = ["POST /api/v4/users/login/desktop_token"]
verified_against = ""
notes = """
The server side of the desktop-token flow is confirmed from source, including \
the 3-minute TTL. What is NOT confirmed is how the /login/desktop page hands \
server_token to a native process. Until that is answered, SSO users use a \
personal access token, and the login dialog should say so rather than failing \
at the password field."""

[[feature]]
id       = "ws.live_events"
area     = "posts"
upstream = "server-api"
status   = "partial"
ws_events = ["hello", "posted", "post_edited", "post_deleted", "channel_member_updated", "multiple_channels_viewed", "channel_viewed", "typing", "status_change", "user_updated"]
verified_against = "12.0.1"
notes = """
posted / post_edited / post_deleted confirmed live, including the `post` \
payload being a JSON document inside a JSON string. A hello carrying a NEW \
connection id is treated as lost events; an event-sequence hole is treated the \
same way, and both now re-fetch the open channel as well as re-syncing the \
sidebar. A newest page that cannot reach what is held -- a laptop asleep for \
longer than a page of messages -- **keeps the fresh tail and discards the \
stale run**, as the plan's rule says, with `older_complete` reopened so \
scrolling up closes the gap the ordinary way. That case previously did \
nothing at all: the page was refused and thrown away, and the channel went on \
showing yesterday's messages with nothing newer. NOT yet done: closing the \
gap eagerly with `after=` paging rather than waiting for the reader to \
scroll, and catching up channels other than the open one, which re-fetch when \
they are next opened.

A message in a channel the store has never heard of -- the first word of \
a new direct message, or a channel the reader was just added to -- asks \
for a sync, at most once every few seconds, since only a sync brings the \
channel, its membership and its category. Verified in the lab: a first \
message from a colleague with no conversation yet made her row in the \
sidebar, and the row opened on the message."""

[[feature]]
id       = "desktop.notifications"
area     = "notify"
upstream = "desktop"
status   = "partial"
verified_against = ""
notes = """
Policy is implemented and fully covered in mm-desktop; delivery goes through \
zbus in mm-desktop-xdg and returns Ok against gnome-shell 46. Whether a banner \
is actually drawn is the shell's own policy and cannot be asserted from here \
-- `mattermost-rs doctor` exists so a person can settle it in one command. \
**Clicking one now goes to the channel it came from** and brings the window \
forward: the notification carries a `default` action, without which most \
shells treat a banner as nothing but a thing to dismiss and a click does \
nothing, which reads as the client ignoring you. Waiting for that click \
means waiting as long as the banner is up, so each one waits on a thread of \
its own, ending when its banner does. The icon is the installed one's name \
rather than the binary's, which is why the test notification used to draw a \
generic placeholder.

**The reader's own account settings decide whether to notify at all**, and \
they were being ignored: the global preference defaulted to "tell me about \
everything", so an account set to mentions-only -- which this one is -- was \
notified about every message in every unmuted channel. Nothing fetched the \
signed-in user's record, because the roster request is built from the DM \
partners and the reader is on nobody's DM list but their own. It is fetched \
on each sync now, for its `notify_props`.

**A sound**, which for most people is the notification: a desktop with \
banners switched off still makes it, and a chat client that arrives in \
silence is one you find out about an hour later. `sound-name` is set to \
`message-new-instant`, the freedesktop sound-naming id for exactly this, so \
the desktop's own theme decides what it sounds like, and \
`desktop_sound: "false"` on the account sends `suppress-sound` instead. \
Whether to make a sound is kept apart from whether to notify, because they \
are separate settings there and somebody who turned the sound off still \
wants the banner. `desktop-entry` goes on every notification too: without \
it GNOME labels the banner from the application name and finds no icon, \
because it looks that name up among installed applications.

Verified on this machine with `dbus-monitor`: the \
`Notify` call carries the `default` action, the right icon name, \
`desktop-entry`, `category` `im.received` and `sound-name`. NOT \
verified: the click itself, which needs somebody to send a mention. \
UNVERIFIED: whether muting alone should silence notifications; see \
NotifySettings::muted_is_silent."""

[[feature]]
id       = "posts.timeline_gaps"
area     = "posts"
upstream = "server-api"
status   = "partial"
verified_against = ""
notes = """
The timeline holds one contiguous run and REFUSES to merge a page whose \
adjacency cannot be established, rather than joining two disjoint runs and \
letting the reader scroll past messages with nothing on screen to say so. The \
plan's full multi-segment model is not built, which is what `since`-based \
backfill needs. Until then every fetch is anchored to what is held."""

[[feature]]
id       = "sidebar.hide_departed"
area     = "sidebar"
upstream = "webapp"
status   = "done"
verified_against = "12.0.1"
notes = """
A one-to-one conversation with somebody who has left the server is kept out \
of the sidebar, and out of the quick switcher, which is drawn from the same \
list. Mentions never offered them. Verified on a live account: 7 of 27 direct \
messages were with deactivated people -- royo, madrunner, aiksandr, blossom, \
bozon, insmurfi, yachaha -- and all seven left, taking the HR category with \
them, since blossom was its only member. Hidden only when the roster actually \
says so: somebody this client has not fetched is shown, because "not known" \
must never be drawn as "gone". Their posts still render wherever they appear. \
NOTE: with no message search yet, a hidden conversation cannot be reopened \
from this client at all."""

[[feature]]
id       = "sidebar.categories"
area     = "sidebar"
upstream = "server-api"
status   = "done"
endpoints = [
  "GET /api/v4/users/{user_id}/teams/{team_id}/channels/categories",
  "PUT /api/v4/users/{user_id}/teams/{team_id}/channels/categories/{category_id}",
]
verified_against = "12.0.1"
notes = """
The server's grouping and ordering, including Favorites, Direct Messages and \
the user's own categories, with the stacking taken from `order` rather than \
from the array. Folding a category is written back: verified on a live server \
by folding one from the client and reading the flag back, false then true then \
false. A folded category still shows its unread channels and whichever channel \
is open, which is what folding means in Mattermost. An empty `sorting` -- what \
the server sends for a category nobody has reordered -- is drawn \
alphabetically, which is inferred from the web app rather than read from the \
server."""

[[feature]]
id       = "threads.view"
area     = "threads"
upstream = "server-api"
status   = "partial"
endpoints = [
  "GET /api/v4/users/{user_id}/teams/{team_id}/threads",
  "PUT /api/v4/users/{user_id}/teams/{team_id}/threads/{thread_id}/read/{timestamp}",
  "PUT /api/v4/users/{user_id}/teams/{team_id}/threads/read",
]
verified_against = "12.0.1"
notes = """
The followed-thread list, with the root message, the channel, the \
participants' faces and the reply count, and Followed/Unreads tabs. The totals \
behind the sidebar badge are the server's account-wide ones, not a count of \
the page: confirmed on a live server reporting 961 threads while returning 50. \
Following and unfollowing is here: a toggle in the thread panel's header, \
where Mattermost puts it, pressed when the thread is in the followed list \
and flat when it is not -- being in that list *is* what following means, \
since the server sends no flag. `PUT` to follow and `DELETE` to stop, the \
one place in this API where the verb carries the whole meaning. Unfollowing \
is applied at once, because it is done to make a noisy thread go away and a \
row that lingers reads as a click that missed; following waits for the \
server, because the thread object comes from there and inventing one would \
draw a row from a guess. Setting the toggle to match a thread being opened \
is guarded against its own handler, or opening a followed thread would \
immediately unfollow it. Verified on a live account: pressed for a thread in \
the list, flat for one opened from a channel.

**A thread can be marked read from the list**, with a button on the row, \
shown only where there is something unread -- a button that does nothing on \
two rows in three is noise, and Mattermost shows it the same way. Applied \
here as well as sent, because the server announces it as a \
`thread_read_changed`, which this client does not decode, and a "mark read" \
that leaves the row bold reads as a click that missed. The account-wide \
totals behind the sidebar badge are adjusted rather than recounted: they \
are the server's, and this page is not all the threads there are.

The moment goes in the **path**, and it is the moment to mark read *up to* \
-- so the last reply's own `create_at` can leave that reply unread, which \
is why one millisecond past it is what gets sent. Verified on a live \
account, on a thread made unread for the purpose: the row left the Unreads \
tab at once, the sidebar badge went with it, and the server's own thread \
list then reported no unread threads.

**Mark all read** sits at the far end of the tab row, which is where \
Mattermost puts the one action that applies to the list rather than to a \
row -- and with hundreds of followed threads it is the only way through a \
morning's backlog. It clears the account-wide totals too, not only the \
page in hand: that is what the server was asked to do, and a badge that \
kept counting threads nobody can see would be a window arguing with \
itself. Verified on a live account, against a thread made unread for the \
purpose: the row stopped being unread, the sidebar badge went, and the \
server's own thread list reported none.

NOT built: the filter control beside the tabs."""

[[feature]]
id       = "drafts.view"
area     = "drafts"
upstream = "server-api"
status   = "partial"
endpoints = ["GET /api/v4/users/{user_id}/teams/{team_id}/drafts"]
verified_against = "12.0.1"
notes = """
Drafts are server-side, so what was typed in the web app is listed here, and \
choosing one goes to its channel. Verified against a live account holding 11 \
of them.

**This client writes drafts now.** A message half-typed in a channel, or a \
reply half-typed in a thread, is written down and brought back: it survives \
switching channels, closing the thread, and quitting. Until now it was \
widget state and nothing else, and clicking somewhere else lost it.

Written a couple of seconds after the typing stops, and again on leaving the \
channel, closing the thread, sending, and closing the window -- not on every \
keystroke, which would be a request per character, and not only on leaving, \
which a crash or a kill from the tray would get in front of. Recorded in the \
store as well as sent, like a folded category, because the composer and this \
view both read the store and waiting for the round trip would lose it \
anyway. Nothing is sent when the text has not changed, and that comparison \
ignores the timestamp the window stamps on it -- otherwise every idle tick \
would look like a change.

An empty draft is a deletion, which is what the server does with one too, \
though it wants a different verb: `DELETE /users/{id}/channels/{id}/drafts`, \
with `?root_id=` for a thread's. Writing one is **`POST /drafts`**, with no \
user and no channel in the path -- the body carries both. That had to be \
measured: `/users/{id}/drafts`, `/users/{id}/channels/{id}/drafts` and \
`/users/{id}/teams/{id}/drafts` all answer 404, and the right one answers a \
bare 201 with no body.

Drafts arrive with the rest of a sync, after the reopened channel is already \
on screen, so the box is filled again when they land -- but only when it is \
empty, since a resync must not replace what somebody is halfway through \
typing.

Verified on a live account: typing in a channel and switching away and back \
brought the text back; quitting and relaunching brought it back from the \
server; sending it cleared the draft here and on the server; and the \
server's own drafts endpoint agreed at every step. NOT built: files attached \
to a draft, which the composer holds and does not write down."""

[[feature]]
id       = "posts.reactions"
area     = "posts"
upstream = "server-api"
status   = "done"
endpoints = [
  "POST /api/v4/reactions",
  "DELETE /api/v4/users/{user_id}/posts/{post_id}/reactions/{emoji_name}",
]
ws_events        = ["reaction_added", "reaction_removed"]
verified_against = "12.0.1"
notes = """
Reactions on the message and one-click reactions on the hover toolbar, both \
toggles: there is no separate way to take a reaction back, here or anywhere in \
Mattermost. The one-click buttons are ranked by what this reader uses most. \
Custom emoji are NOT fetched, so one resolves to its shortcode rather than an \
image."""

[[feature]]
id       = "files.inline_images"
area     = "files"
upstream = "server-api"
status   = "partial"
endpoints = [
  "GET /api/v4/files/{file_id}",
  "GET /api/v4/files/{file_id}/preview",
]
verified_against = "12.0.1"
notes = """
An attached image is drawn in the row at the size its metadata states, from \
the `mini_preview` thumbnail that rides in the post so the row never reflows, \
and clicking it opens the full-size copy in a window. Download, and \
anything that is not a picture, are `posts.attachments`' business and are \
built there -- this row claimed otherwise for longer than it was true. An \
animated GIF renders its first frame."""

[[feature]]
id       = "posts.mention_autocomplete"
area     = "posts"
upstream = "webapp"
status   = "partial"
endpoints = ["GET /api/v4/users"]
verified_against = "12.0.1"
notes = """
Typing `@` offers the open channel's members under a CHANNEL MEMBERS heading \
and everybody else under NOT IN CHANNEL, with the name beside the username \
the way Mattermost shows it. Tab or Return completes, Up and Down move over \
the headings, Escape dismisses. In both composers, each knowing its own \
channel -- the thread composer takes it from the root post, not from whatever \
is open behind it. Ranked locally on four keys: the people in this \
conversation first, then match quality (username prefix, then human-name \
prefix, then a username merely containing it), then whoever spoke here most \
recently, and the alphabet only to break a tie. The roster is fetched once \
when the channel opens rather than per keystroke the way the web app does it; \
a channel never opened falls back to everyone known. Verified on a live \
account: `@` in Клиенты offers aragorn first, who had just posted, where it \
previously offered an alphabetical mix drawn from every channel visited. **The server is asked when the store is short of names.** Only then: on a \
small server, or for somebody already seen, the local list is the whole \
answer and a request would be waste -- so it goes out when fewer than three \
names match, the half-typed name is at least two characters, and those \
exact letters have not been asked about already, which matters because this \
runs on every keystroke. The answer comes back as two lists, in the channel \
and on the team, and the in-channel one is *added* to the roster rather than \
becoming it: replacing a channel's members with whoever's name starts with \
"al" would shrink the channel to those people. The popup is in nothing the \
redraw walks, so it keeps a way to draw itself again when the answer lands; \
an answer to letters already typed past still adds the names but does not \
redraw. `in_team` is required whenever `in_channel` is given -- without it \
the server answers **500**, not 400, with "Team id parameter is required to \
autocomplete by channel", which reads like a server fault rather than a \
missing parameter. Verified on a live account: typing `@gera` offered \
`@geralt`, a person this client had never seen, with their face fetched \
behind it. `@all`, `@channel` and `@here` are offered \
under their own SPECIAL MENTIONS heading, from the same list the renderer \
highlights them with -- two lists would be a name the composer offers and \
the message does not mark."""

[[feature]]
id       = "posts.warm_channels"
area     = "posts"
upstream = "webapp"
status   = "done"
endpoints = ["GET /api/v4/channels/{channel_id}/posts"]
verified_against = "12.0.1"
notes = """
The thirty most recently active channels are fetched in the background \
once the sync is done, two at a time with a gap between starts, so that \
clicking one does not cost a round trip. Opening a channel draws what is \
already held first and splices in the answer when it comes, which is what \
removes the wait -- measured on a live account: 31 pages warmed within \
twenty seconds of launch, and a click then draws 95 rows in 99 ms with no \
request in the path. Bounded on purpose: a channel outside the thirty, or \
one silent for months, is still fetched the ordinary way."""

[[feature]]
id       = "posts.edit"
area     = "posts"
upstream = "server-api"
status   = "partial"
endpoints = ["PUT /api/v4/posts/{post_id}"]
ws_events = ["post_edited"]
notes = """
Edit message, on the reader's own messages, opening the markdown they \
wrote in a window of its own rather than turning the row into a text box: \
a recycled `ListView` row is taken out from under the caret the moment \
anything else arrives. Verified on a live account, in the reader's own DM: \
the editor opened with the message's own text, saving changed it, and the \
server's copy came back with the new text and a non-zero `edit_at`. `PostEditTimeLimit` is read \
from the client config too, so a message too old to edit is not offered \
for editing -- not in the menu and not to the Up key -- rather than \
refused by the server after the editor has been typed into. The server \
still has the last word, and anything unreadable in the setting is \
treated as no limit for that reason."""

[[feature]]
id       = "search.quick_switcher"
area     = "search"
upstream = "webapp"
status   = "done"
verified_against = "12.0.1"
notes = """
Ctrl+K, the way Mattermost binds it: type a few letters, press Return, be \
there. The one piece of searching that needs no endpoint -- every channel the \
reader is in is already in the store -- so it is ranked locally: a name that \
starts with what was typed, then one where a word does, then one that merely \
contains it, and unread first within each tier. Verified on a live account by \
typing `env` and landing in Prod-environment.

**A channel with no row in the sidebar used to be unreachable from here.** \
Going somewhere was done by finding its row and selecting it, and letting \
the sidebar's own handler do the work -- so a channel in a folded category, \
or one hidden by the unread filter, was found by the switcher, selected \
nothing, and left the window where it was with nothing on screen admitting \
it. Opening a channel is its own thing now and the sidebar's selection \
reflects it, which is the right way round; and the category it is in is \
unfolded, because arriving somewhere the reader cannot see in the sidebar is \
disorienting. The unfolding is sent to the server too, so it follows them to \
their other clients. Verified on a live account: `tech_team`, in a folded \
FAVORITES, opened and the category came open with it -- where before, \
clicking the row and pressing Return had both done nothing at all.

Verified in the lab, by keys on its display: Ctrl+K opened the finder, \
"Design" typed into it narrowed the list, and Return opened Design."""

[[feature]]
id       = "search.people_and_channels"
area     = "search"
upstream = "server-api"
status   = "partial"
endpoints = [
  "POST /api/v4/teams/{team_id}/channels/search",
  "POST /api/v4/users/search",
  "POST /api/v4/channels/{channel_id}/members",
  "POST /api/v4/channels/direct",
]
verified_against = "12.0.1"
notes = """
The quick switcher asks the server as well as itself. Under what it already \
knows it draws NOT JOINED -- public channels in the team the reader is not a \
member of, which were previously unreachable without going back to the \
Electron client -- and PEOPLE, anyone on the team whether or not there is \
already a conversation with them. Choosing a channel joins it and opens it; \
choosing a person opens the conversation, creating it only if there is not \
one, which is the same call either way so there is nothing to check first. \
The server is asked only from the second character, since one letter matches \
most of a server, and an answer to a query the reader has already typed past \
is dropped rather than drawn. A failed search is silent: the local results \
are already on screen and a shorter list needs no error line. Verified on a \
live account: "test" offered a public channel outside the sidebar, "ale" \
offered four people, and choosing one opened the conversation. Joining is lab-verified: after leaving a channel, Ctrl+K found it among \
the ones not joined and Return put the reader back in it, on the server \
too. **Joining** posts a "user joined the channel" notice that everybody \
in it sees, so it was built but not tried. **Archived channels** are found too: the switcher asks the server for \
the archived whose name matches and lists them apart, under ARCHIVED, \
and Return opens one read-only -- the box greyed, the status line \
saying why -- since it can be read and not written in. A channel \
archived while the window is open leaves the sidebar over the socket \
(`channel_deleted`) and comes back on `channel_restored`. Verified in \
the lab, end to end. NOT built: searching across teams."""

[[feature]]
id       = "posts.link_previews"
area     = "posts"
upstream = "webapp"
status   = "done"
endpoints = ["GET /api/v4/channels/{channel_id}/posts"]
verified_against = ""
notes = """
A URL the server has already resolved draws as a card under the message: the \
site name, the title as a link, the description, and the picture the page \
offered. Read out of `metadata.embeds`, where only the `opengraph` entries \
carry a `data` at all -- the others are `null`, and a card with neither title \
nor description is not drawn, because a card showing only a URL says less \
than the link already in the text. The picture is fetched straight from \
whoever hosts it, over https only and deliberately **without the session \
token**: sending a Mattermost credential to a third party because somebody \
pasted a URL would be a security bug. Asked once per URL and held in memory \
for the session; a dead image host leaves the card's text and no picture."""

[[feature]]
id       = "users.presence"
area     = "users"
upstream = "server-api"
status   = "partial"
endpoints = [
  "POST /api/v4/users/status/ids",
  "PUT /api/v4/users/{user_id}/status",
  "PUT /api/v4/users/me/status/custom",
  "DELETE /api/v4/users/me/status/custom",
]
ws_events = ["status_change", "user_updated"]
verified_against = "12.0.1"
notes = """
A dot in the corner of every face: green for online, amber for away, red for \
do not disturb, and nothing at all for offline, which is what Mattermost \
does rather than draw a column of grey dots about people who are simply not \
at work. Fetched in one POST for the sidebar's DM partners after a sync and \
for a channel's roster after it opens -- the ids go in the body because a \
roster is two hundred of them, which is past the usual proxy limit and would \
put everyone the reader is looking at into an access log. Kept current by \
`status_change`, and a repeat of what is already held produces no change so \
a second device reporting the same state does not redraw every row. An \
unrecognised status reads as offline rather than failing the batch. \
Verified on a live account: aragorn's face carries a green dot.

A dot beside the account name in the sidebar is this reader's own, and the \
button that moves it: Online, Away, Do not disturb, Offline, with the one \
it is already on shown but not offered -- asking the server to set what it \
already says is a round trip for nothing. Mattermost puts this behind the \
avatar in its header; there is no avatar up here, so it sits beside the \
account it belongs to. This reader is on no DM list of their own, so the \
sync now asks for their status along with everybody else's, and a \
`status_change` from another client moves the dot because the coalesced \
redraw refreshes it. Unlike most requests here a failure is worth a \
complaint: the reader chose this, and the dot not moving is the only sign \
they would otherwise get.

Verified against the live account: the menu set it to Away, the dot turned \
amber, setting it back to Online turned it green, and the server's own \
`GET /users/{id}/status` then read `online` with `manual:false` -- the \
server clears the manual flag when a status goes back to online, so \
choosing one leaves nothing behind.

Asked for again every minute, for the faces actually on screen -- the \
sidebar's conversations and the open channel's authors, never the whole \
server. Without it somebody who walks away produces no event at all, and \
after an hour at the desk the sidebar is a wall of green dots about people \
who went home. A minute is what Mattermost's own webapp uses: a dot a \
minute out of date is nobody's problem, and anything faster is a request a \
minute for decoration.

**A custom status** -- the emoji and line of text Mattermost shows \
beside a name -- is read off the `customStatus` prop and drawn on the \
profile card, with its expiry honoured locally so a lunch that ended \
is not still being eaten. Setting your own is in the status menu: a \
dialog with the emoji picker, the text and a "clear after" choice, and \
the menu shows the one that is set with a row to clear it. The expiry \
is the client's to work out, as in the webapp -- the server stores the \
duration word and the moment and checks neither against the other -- \
and "this week" ends on Sunday here, not on the Saturday an en-US \
`moment()` picks. Verified in the lab: the dialog set it, the server's \
own copy of the user carried the text, and clearing it from the menu \
left the server with empty fields, which is how it records "none".

The emoji is drawn beside the author's name on every message too, the \
way the webapp draws it, with the text as its tooltip -- read from the \
store when the pointer rests there, not set per row. A `user_updated` \
puts it on, or takes it off, the rows on screen without rebuilding \
them, the way presence and faces are handled; the once-a-minute \
presence poll is what catches one that has run out. Verified in the \
lab: a colleague's status set over the API appeared beside her name \
in the open channel and went when it was cleared. The sidebar shows it after a \
conversation's name too, and the reader's own sits beside their dot.

**A timed do-not-disturb**: the status menu offers the same four spans \
Mattermost does -- 30 minutes, 1 hour, 2 hours, until tomorrow (nine in \
the morning) -- sent as `dnd_end_time`, which the server counts in \
*seconds* where everything else on the wire is milliseconds, and the \
menu says when a running one ends. Verified in the lab: the hour row \
left the server holding `dnd` ending an hour on, and Online took it off."""

[[feature]]
id       = "posts.typing"
area     = "posts"
upstream = "webapp"
status   = "partial"
endpoints = []
ws_events = ["typing"]
verified_against = "12.0.1"
notes = """
"somebody is typing…" between the last message and the box being typed into, \
naming one person, two by name, or "Several people" beyond that. Held in the \
window rather than the store because it expires on a clock and the store is \
deliberately clock-free so that replaying events stays exact; an entry older \
than seven seconds is dropped, which is longer than the server's own \
five-second `TimeBetweenUserTypingUpdatesMilliseconds` throttle so the line \
does not flicker between a typist's keystrokes.

**Sent as well as received now**, from both boxes. Over the WebSocket, not \
REST: it is an action on the socket, and the frame builder was already in \
`mm-api` waiting for a caller. The socket task owns the connection and is \
parked reading it, so the frame is handed to that task rather than written \
from the command loop -- one `select!` over the read and a queue, with the \
frame carried out of the select and written after it, because the read \
borrows the socket for as long as it waits.

Throttled to one frame every four seconds while the typing goes on: the \
server forgets a `user_typing` after five whichever client sent it, so that \
keeps the indicator up without sending a frame per character. Silent while \
a draft is being put back into the box -- filling it is not somebody \
writing, and announcing it on every channel switch would tell a team you \
were about to say something when you were only looking.

Verified on a live account: the server answered the frame with `status: \
OK`. NOT verified: that a colleague's client draws it, which is their \
client's business and cannot be seen from this account -- Mattermost does \
not show you your own typing.

The lab caught the frame being read wrong: the server puts the channel \
on the frame's *broadcast*, not in its data, and a decoder reading the \
data alone filed every typing notice under an empty channel. Read from \
the data first and the broadcast second now. Verified in the lab: a \
colleague's `POST /users/{id}/typing` put "ada is typing…" under the \
open channel's messages."""

[[feature]]
id       = "posts.message_times"
area     = "posts"
upstream = "webapp"
status   = "done"
endpoints = []
verified_against = ""
notes = """
The channel shows a clock time under a day separator, the way Mattermost \
does. The thread panel has no separators, so it says how long ago instead -- \
"6 days ago", "last week", "2 weeks ago" -- and falls back to a date past a \
month. Either way the whole moment, down to the second, is the tooltip on \
the time: two messages a moment apart show the same clock time, and that is \
where a reader goes to tell them apart."""

[[feature]]
id       = "posts.composer"
area     = "posts"
upstream = "webapp"
status   = "partial"
endpoints = ["POST /api/v4/posts"]
verified_against = "12.0.1"
notes = """
A `TextView` rather than an `Entry`, because a message is not one line: \
Shift+Return puts in a newline and Return sends, which is the binding \
Mattermost uses and the one muscle memory expects. An `Entry` could express \
neither, having no newline to insert. The box grows with what is typed and \
scrolls past about six lines rather than pushing the conversation off the \
top; a placeholder is drawn over it while it is empty, since a `TextView` \
has none of its own. The caret moves there when a channel is opened. Both \
composers, and the mention popup's Return still completes rather than sends, \
because its key handler is installed first and stops the event while the \
popup is up. Verified on a live account: three lines typed with Shift+Return \
stayed three lines, and Return cleared the box. A smiley beside the paperclip opens the same picker the hover toolbar \
uses and inserts the **shortcode**, not the character: that is what \
Mattermost stores and what every other client renders from, so a message \
written here reads the same everywhere and stays editable as text.

**Mattermost's formatting keys** are here: Ctrl+B, Ctrl+I, Ctrl+Shift+X \
and Ctrl+Shift+C put markers round the selection and take them off again \
-- a toggle, the way every editor does it, so pressing bold twice leaves \
what you started with. The markers are looked for outside the selection \
first, which is what double-clicking the word inside `**word**` gives, and \
then inside it, which is what dragging across them gives. With nothing \
selected the markers go in and the caret lands between them. The \
arithmetic is in `mm_md::wrap`, where the awkward cases are settled by \
tests rather than by trying them in the window, and it counts characters \
rather than bytes so a Cyrillic word is not sliced in half. Verified on a \
live account: Ctrl+B made `**bold**`, Ctrl+B again took it back, and \
Ctrl+Shift+C made a code span of it.

NOT built: the formatting toolbar -- which is the other way to offer the \
above, and is what Mattermost draws; for somebody who types code into chat \
all day the keys are the thing, and a row of buttons takes height from the \
conversation permanently -- and the markdown preview eye.

The thread box is lab-verified: a reply typed into "Reply…" and sent with \
Return landed under the root on the server, and Escape put the panel \
away."""

[[feature]]
id       = "posts.spellcheck"
area     = "posts"
upstream = "electron"
status   = "partial"
endpoints = []
verified_against = "12.0.1"
notes = """
Red squiggles under what is not a word, in **every language this machine \
has a dictionary for**, and replacements on a right-click. Hunspell \
dictionaries read with `spellbook`, which is pure Rust: no C library to \
link, nothing for the `.deb` but a recommendation, and no `unsafe` near a \
workspace that forbids it. (`spellbook` is MPL-2.0, which is file-level \
copyleft and imposes nothing on this MIT tree beyond its own files.) One \
dictionary per language rather than per locale -- the locale's variant \
wins, else the one whose region repeats the language -- so five English \
variants do not become five copies of English that accept both "colour" \
and "color". A word is wrong only when **no** dictionary knows it, which \
is what makes a sentence of mixed Russian and English check correctly in \
both. Deciding what counts as a word is pure and lives in `mm-md` at \
100%: mentions, channel links, emoji codes, URLs, paths, snake_case, \
anything with a digit in it, acronyms, single letters and everything \
between backticks are all left alone, because a composer in a channel \
like this one would otherwise be solid red. The dictionaries load on a \
worker thread -- `ru_RU.dic` is 3.4 MB -- and checking is debounced 400 ms \
so a word is not marked wrong while it is still half typed. Verified on a \
live account: "Ошибки в сообщениии and teh wrong word" underlines exactly \
"сообщениии" and "teh".

**Add to dictionary** sits under the suggestions in the right-click menu, \
and is offered even when there are none -- a word with no suggestions is \
the likeliest one to be a service name somebody wants accepted rather than \
corrected. A chat client for a team is full of names no dictionary has, \
and underlining every one of them turns the feature into noise somebody \
switches off. The words are kept in a plain list under `XDG_DATA_HOME`, \
not in the cache: a word somebody taught this client is not something to \
throw away to reclaim space. They are held beside the dictionaries rather \
than written into one, because `spellbook` takes its input as text at \
construction and adding a word would mean rebuilding three and a half \
megabytes of Russian. Writing the file is best effort: a read-only home \
still gets the word accepted for the session. Verified on this machine: a \
jargon word was underlined, "Add to dictionary" took the underline away at \
once, and the word was in the file afterwards.

NOT built: grammar as opposed to spelling, and spell-checking anything but \
the two composers."""

[[feature]]
id       = "users.profile_card"
area     = "users"
upstream = "webapp"
status   = "partial"
endpoints = ["GET /api/v4/users"]
verified_against = "12.0.1"
notes = """
Clicking a name or a face in a message opens that person's card: their \
picture with its presence dot, their full name, their username, their job \
title, their email where the server discloses it, and the time where they \
are. Built from the roster already held rather than fetched, so it opens \
without a round trip; a field the server withheld is left out rather than \
drawn blank, which is why `email` is simply absent on a server that \
sanitizes it. The local time needs the person's IANA zone -- Mattermost \
sends it as three strings with the boolean written out as text -- and the \
line is omitted when there is no zone or this build's timezone database \
has never heard of it, because a missing clock beats a wrong one. \
Verified on a live account: aragorn's card reads his full name, \
@aragorn, Project Manager/Operations Assistant, and 18:20 at GMT+03:00. \
A **Message** button at the foot opens the conversation with that person, \
and the server makes one if there is not one yet. Not offered for the \
reader themself -- Mattermost has a self-DM and this is not how anyone \
reaches it -- nor for somebody who has left, who cannot be written to. \
Verified on a live account: the card for a colleague opened the DM with \
them.

**A custom status** -- the emoji and words somebody puts beside their name \
-- is drawn under the username. It is a JSON document inside a JSON string \
inside `props`, the same wart as `post` and `reaction` on the WebSocket in \
a different place, and it **expires**: on the server this was built \
against, twenty-four people have one and every single one has run out, \
because people set "Out for lunch" for an hour and never clear it. A \
client that ignored `expires_at` would show last October's lunch. No \
expiry at all is written as the year-one sentinel `0001-01-01T00:00:00Z` \
rather than an absent field. The emoji goes through the same path a \
message's does, so one of the server's own draws as a picture. Verified on \
a live account: a colleague whose status has no expiry shows their emoji \
and their words, and the two dozen expired ones show nothing.

The card opens over an `@mention` in message text too, pointing at the \
name, for anybody the store knows. A mention is a Pango link in the \
label (`mention:name`) so the label itself reports the click, and the \
same card opens from a `TextView` body through its link handler. \
Verified in the lab: a faked click on the first word of "@legion \
something new in Design." opened a card saying Legion Admin and \
@legion, and Escape closed it. **Setting your own**: "Edit profile…" in the status menu opens the \
names and the position, and sends only what changed; the server tells \
everyone, this window included, with a `user_updated`. The username is \
not offered -- an administrator may forbid changing it, and it is the \
one thing other people type to reach you. Verified in the lab: a \
position typed into the dialog was the server's. NOT built: the \
picture, which needs a file picker the lab cannot drive either."""

[[feature]]
id       = "sidebar.drag_between_categories"
area     = "sidebar"
upstream = "webapp"
status   = "partial"
endpoints = ["PUT /api/v4/users/{user_id}/teams/{team_id}/channels/categories"]
verified_against = "12.0.1"
notes = """
A channel or DM can be dragged from one category to another, and to a \
different place within one. Dropping it on a heading puts it at the top of \
that category, which is what a folded category needs: it shows no rows to \
aim between. Dropping it on a channel puts it just above that channel. \
Both categories go back in **one** request -- the bulk endpoint the web \
app's own drag-and-drop uses -- because sending them separately leaves a \
window in which the server has the channel in both categories or in \
neither, and the next sync reads that back as the truth. Applied locally \
first, like folding, so the sidebar follows the pointer rather than the \
round trip. Where it lands is expressed against a neighbouring channel \
rather than as an index, because the sidebar can be showing fewer rows \
than the category holds -- a folded category shows none, the unread filter \
hides the rest -- so a position on screen is not a position in \
`channel_ids`. Verified on a live account: a DM dragged out of QA onto the \
ALLERT heading moved, and dragging it back above quant restored the \
sidebar exactly. NOT built: dragging a category heading to reorder the \
categories themselves, and dragging a channel out of the sidebar."""

[[feature]]
id       = "posts.search"
area     = "posts"
upstream = "server-api"
status   = "partial"
endpoints = ["POST /api/v4/teams/{team_id}/posts/search"]
verified_against = "12.0.1"
notes = """
Ctrl+Shift+F, or the magnifier in the header. The terms go to the server \
untouched: its own query language -- `from:`, `in:`, `before:`, quoted \
phrases, `-excluded` -- is parsed there, and a client that tried to \
interpret it could only get it wrong. Searched on Return rather than per \
keystroke, because every letter of a half-typed `from:legion` would \
otherwise be its own query. Results draw as the rows the Threads and \
Drafts views use -- who said it, where, when, the message -- since a hit \
is a place to go; clicking one opens its channel. The people who wrote \
them are fetched with the answer: a channel's page has always done that, \
and these three lists did not, so a hit from a channel this client had \
never opened drew the author's raw id where a name should be. The hits join the one \
post map but **not** a timeline: a result sits next to the result above \
it for reasons that have nothing to do with time, and filing them as \
history would be the client inventing adjacency the server never claimed. \
Verified on a live account: "deploy" answered with 100 hits across \
several channels.

A full page offers **Load more results** at its foot, which asks for the \
next one and adds to what is on screen -- deduplicated, because the \
server pages by offset and a message posted between two requests shifts \
everything down one. A button rather than scrolling to the end: the \
server states no total, so a full page is the only evidence another one \
exists.

On this server there is never another one, and that is the part worth \
writing down. Measured against the live 12.0.1 server, `per_page` in the \
body is **ignored** -- 10, 60 and no paging at all each answer with a \
hundred hits -- and `page: 1` answers with nothing even though page 0 was \
full. A hundred is Mattermost's own `LIMIT` on the SQL search; paging is \
honoured only where Elasticsearch or Bleve is configured, which is \
licensed and absent from most self-hosted servers. So the request asks \
for a hundred, which is what it will be handed either way, and an empty \
next page says **no more results** out loud rather than letting the \
button vanish having done nothing, which reads as a bug. Written down in \
`docs/protocol.md`, since the API documentation makes `page` and \
`per_page` look like ordinary paging. Verified on the live account: \
"test" found a hundred hits with the button under them, and clicking it \
said no more results and took the button away.

**The words looked for are picked out in bold** in each hit. Not from the \
server's `matches`, which is `null` without Elasticsearch -- measured on \
the live server -- but from the query, picked apart here: the modifiers \
ride in the same string as the words, and a client that highlighted them \
would bold `from` in every result. So `from:`, `in:`, `before:` and the \
rest are dropped by shape rather than by a list, `-excluded` is dropped \
because it cannot appear in a hit anyway, a trailing `*` is reduced to its \
stem, and `"a quoted phrase"` stays one unit so its two words are not \
pointed at separately wherever they occur. The matching runs over \
characters rather than bytes, or a Cyrillic query would slice a Cyrillic \
letter in half and hand Pango broken markup; where lowercasing changes the \
character count at all -- a Turkish dotted capital I becomes two -- it \
gives up and draws the text plain, because without the bold beats wrong. \
Verified on a live account: searching `redirector` drew it in bold in \
every one of a hundred hits.

NOT built: jumping to the hit's exact place in its channel's scrollback -- \
clicking a result opens the channel and that message's own thread beside \
it, which puts the message on screen without the timeline having to grow a \
segment around a post from a year ago."""

[[feature]]
id       = "posts.pinned_and_saved"
area     = "posts"
upstream = "server-api"
status   = "partial"
endpoints = [
  "GET /api/v4/channels/{channel_id}/pinned",
  "GET /api/v4/users/{user_id}/posts/flagged",
]
verified_against = "12.0.1"
notes = """
The pin and bookmark buttons in the header: what is pinned in the open \
channel, and what this reader has saved anywhere. Both share the search \
page, because from the store's side the three are one thing -- a set of \
posts in an order the server chose, which is not the order of any \
channel. A failed fetch is reported rather than swallowed: an empty pane \
and a failed request look identical, and the drafts list already taught \
that lesson once. Saved posts are still `flagged` on the wire; the web \
app has said "Saved" since 5.x. Verified on a live account: three saved \
messages came back across three channels, and a channel with no pins said \
so. A button at the right-hand end of each row takes the post off the list \
it is being shown in -- unpin on the pinned list, remove on the saved \
one. Only on those two: the list **is** the thing being changed there, \
while a search result has nothing to be taken off. Until now the only \
way to unpin was to find the message in its channel, which is the one \
place the pinned list exists to save you going. The list is asked for \
again afterwards rather than edited in place: the server answers a pin \
with an event about the *post*, not about the list, so nothing would \
otherwise redraw the page.

Two bugs came out of building it, both of which had been shipped. \
Unsaving sent `PUT` to `/users/{id}/preferences/delete`, which is a \
`POST` -- the server answered 404, which reads like a missing post \
rather than a wrong verb, and the post stayed saved with nothing on \
screen admitting it. And a save was sent without being recorded here, \
so the menu went on offering "Remove from saved" for a post that had \
just been unsaved: saving is a preference, and the server announces a \
changed preference over an event this client did not then decode. It \
does now: `preferences_changed` and `preferences_deleted` move the \
menu and the saved list the way a sync would, and a window showing the \
saved list asks the server for it again, since the order is the \
server's. Verified in the lab: a post saved through the preference API, \
as another client of the account would, appeared in the open saved \
view, and went when the preference was deleted.

Verified against the live account on the self-DM: saving a message put \
it at the top of the saved list, the button took it off and the \
server's own flagged-posts endpoint agreed; pinning one put it on the \
pinned list and the button emptied it again. NOT built: paging.

The hover toolbar's overflow menu is lab-verified too: resting the pointer \
on a message brought the toolbar up, "Pin to channel" left the server \
holding the post pinned, and "Unpin from channel" took it off. Saving from the message \
menu is lab-verified too: "Save message" put the post on the server's \
saved list and "Remove from saved" took it off."""

[[feature]]
id       = "channels.info_and_members"
area     = "channels"
upstream = "webapp"
status   = "partial"
endpoints = ["GET /api/v4/users"]
verified_against = "12.0.1"
notes = """
The channel's name in the header is a button, and it opens what the \
channel is and who is in it: the header line, then every member with \
their face, their presence and their name. Everything is already held -- \
the header came with the channel and the roster was fetched when it \
opened -- so it opens on the click rather than after a round trip. \
People who have left the server are left out, because the member count \
beside the channel's name leaves them out too and a list of thirty-five \
under a heading saying twenty-four is a window disagreeing with itself. \
A channel never opened says "Not loaded yet" rather than claiming it is \
deserted. Verified on a live account: Клиенты reads 24 in the header and \
24 in the list, where the raw roster holds 35. Muting is here too -- see `channels.mute` -- and so is **how loudly the \
channel notifies**: Default, All, Mentions, Nothing, drawn as a row of \
linked buttons rather than a dropdown, because there are four, they are \
short, and which one is on should be readable without opening anything. \
Default is not a fifth state: it is the channel saying nothing and the \
account's own setting deciding, which is what the server stores for a \
channel nobody has touched. A separate request from muting, deliberately: \
`mark_unread` is about the bold in the sidebar and `desktop` is about the \
banner, and one call carrying both would mean every change to one \
restating the other. Verified on a live account: choosing Mentions put \
`desktop: "mention"` on the membership and choosing Default put it back.

**Edit channel…** opens the name, header and purpose for changing, and \
sends only what changed; the socket's `channel_updated` brings the change \
back to every window, this one included. **Archive channel** asks first \
and then does what the webapp does. Both lab-verified: a header typed \
into the dialog was the server's and then the menu's; archiving from the \
menu left the server holding the channel archived and the sidebar \
without it. NOT built: converting a channel to private. Membership is \
its own row: see `channels.membership`."""

[[feature]]
id       = "channels.membership"
area     = "channels"
upstream = "server-api"
status   = "done"
endpoints = [
  "POST /api/v4/channels/{channel_id}/members",
  "DELETE /api/v4/channels/{channel_id}/members/{user_id}",
  "GET /api/v4/users/autocomplete",
]
ws_events        = ["user_added", "user_removed"]
verified_against = "12.0.1"
notes = """
Adding somebody to a channel, taking somebody out, and leaving. All \
three live in the channel menu: a minus beside every member but \
yourself, an ADD PEOPLE search under the roster, and a destructive \
button at the bottom. Leaving is removing yourself -- there is no \
separate route, and the server tells the two apart by whose id is in \
the path.

The candidates to add come from the server rather than the store, \
because the point is the people who are *not* here and the store only \
knows who this client has already seen. It is the composer's `@` \
request read the other way round: `autocomplete_users` answers with \
`users` and `out_of_channel`, and this reads the second list.

**Town Square cannot be left.** The server answers 403 and the \
membership stays, so the button is off with a tooltip saying why rather \
than hopeful. A conversation has no membership to edit either: a DM is \
closed, not left, so its menu shows the roster and nothing else.

Leaving asks first, because none of it is recoverable by pressing the \
button again: the server posts "x left the channel" into it, everybody \
still there sees that, and a private channel cannot be rejoined without \
being invited back -- which the question says, differently, for a \
private channel.

The two WebSocket events are **not mirror images of each other**, and \
the difference is load-bearing. `user_added` always carries the channel \
in `broadcast` and the person in `data`. `user_removed` does the same \
for everyone still in the channel -- but the copy sent to the person \
removed carries `data.channel_id` and `broadcast.user_id`, with no \
`broadcast.channel_id` at all. Reading one field from each side is what \
makes being removed from a channel something this client notices rather \
than a row that stays in the sidebar until the next restart.

Verified against a lab server at 12.0.1 rather than a live one, which \
is the whole reason the lab exists: every one of these writes posts a \
system message into a channel that other people are reading. Three of \
the four are now checked by `make ui-test` on every run -- the real \
buttons, driven over the accessibility bus, with the server asked \
afterwards whether it agrees. Adding \
linus to Engineering took the header from 4 to 5, put the system notice \
in the conversation, and the server's member list agreed; removing him \
put it back. Leaving took the row out of the sidebar and moved the \
window to the next channel, and the server stopped listing it. Being \
added from another session brought the row back live; being removed \
while that channel was open took it away and moved the window on."""

[[feature]]
id       = "posts.attachments"
area     = "posts"
upstream = "webapp"
status   = "partial"
endpoints = [
  "POST /api/v4/files",
  "POST /api/v4/posts",
  "GET /api/v4/files/{file_id}",
]
verified_against = "12.0.1"
notes = """
A paperclip on both composers: pick files, see them as chips above the box, \
take one off again, and send. Uploaded first and posted second, because a \
post carries file *ids* and the ids do not exist until the bytes are on the \
server; an upload that fails stops the send, since posting the message \
without the file somebody attached is worse than not posting it. A file on \
its own is a message, with no text, the way Mattermost sends one. Anything \
not drawn as a picture -- a document, an archive, an image whose size the \
server never stated -- gets a row naming it with its size and a button that \
writes it into the download folder, reporting where it landed. The name \
comes off the wire, so it is reduced to its last component before it is \
used: `../../../.bashrc` is a file name. A name already taken grows a \
counter rather than overwriting. Verified on a live account, in the \
reader's own DM: a PNG uploaded and rendered inline, a text file uploaded \
and saved back to ~/Downloads with its contents intact. **Ctrl+V with a picture on the clipboard attaches it**, which is how most \
images get into a chat -- without it every screenshot is: save it somewhere, \
click the paperclip, find it again, remember to delete it later. Whether the \
clipboard holds an image is asked synchronously off the advertised formats, \
because that decides then and there whether to let the key through to the \
box: reading the image itself is asynchronous, and by the time it answered \
the text would already have been pasted. Files dragged onto the composer are \
attached too. A pasted image carries its **bytes** and never touches the \
disk; only a file the reader picked is a path, read at the moment of \
sending. Writing the paste to a temporary file would mean one file in the \
cache per paste and something, somewhere, remembering to delete it, which is \
a leak with extra steps. Verified on a live account: a picture on the \
clipboard became an attachment chip, sent, and rendered inline in the \
conversation with nothing written to disk -- and ordinary text still pastes \
as text.

**A big file goes up in pieces** -- an upload session opened with the \
size, a megabyte a request, the server naming the file when the last \
byte is in -- and the status line says how far it has got, because a \
screencast is tens of megabytes and silence reads as a hang. NOT \
verified in the lab, which has no way to hand the window a file. **Open**, beside Save on a file that is not a picture, fetches it and \
hands a copy under its own name to the desktop's handler for its kind \
-- a PDF to the PDF viewer -- which is a preview this client could \
never draw as well. The copy lives in the cache, one folder per file \
id, so two attachments called `report.pdf` do not take turns. NOT \
verified in the lab, which has no handlers to open anything with."""

[[feature]]
id       = "desktop.window_geometry"
area     = "desktop"
upstream = "electron"
status   = "partial"
endpoints = []
verified_against = ""
notes = """
The window opens the size it was closed at, and maximized if it was \
maximized. This client lives in half a screen, and opening at a default \
size every launch means dragging it into place every launch -- which is \
what `bounds-info.json` is for on the Electron side. **Size only, not \
position**: on X11 the window manager owns placement and GTK4 deliberately \
offers no way to ask for a spot, so a client that saved coordinates it \
cannot restore would be lying in its own state file. A saved size that \
could only have come from a window measured mid-unmap, or from a monitor \
that is no longer attached, falls back to the default rather than opening \
as a postage stamp. Written to `~/.local/state/mattermost-rs/window.json`, \
best effort: a client that refused to close because it could not write \
down its own size would be worse than one that opens at the default. NOT \
built: remembering which monitor, which the display server does not let a \
client choose anyway."""

[[feature]]
id       = "channels.mute"
area     = "channels"
upstream = "server-api"
status   = "done"
endpoints = ["PUT /api/v4/channels/{channel_id}/members/{user_id}/notify_props"]
verified_against = "12.0.1"
notes = """
A switch in the channel menu, with a line saying what muting actually does: \
the unread marker goes, mentions still show. There is no mute flag on the \
wire -- `notify_props.mark_unread` is `"mention"` for a muted channel and \
`"all"` for one that is not -- which is the single thing most likely to be \
got wrong by somebody looking for a boolean. Applied locally and sent on, \
like folding a category, so the sidebar goes quiet under the click rather \
than when the server answers. The endpoint patches, so the reader's other \
notification settings are left alone. Verified on a live account: muting \
the reader's own DM put the muted icon on its sidebar row and unmuting \
took it off again."""

[[feature]]
id       = "posts.emoji_picker"
area     = "posts"
upstream = "webapp"
status   = "partial"
endpoints = ["POST /api/v4/reactions"]
verified_against = "12.0.1"
notes = """
A smiley on the hover toolbar, beside the three reactions the client \
guessed at, opening the whole table with a search box. Searching matches \
the shortcode first and the emoji's own name second, so "smile" finds \
`:smile:` before `:smiley_cat:` and "grinning" finds one whose shortcode \
does not contain the word. Picking one toggles, like the quick buttons. \
The popover is built per opening rather than kept: it is a few hundred \
buttons and one per message row is how a client ends up using a gigabyte. \
The composer has the same picker beside its paperclip, and that one \
inserts the **shortcode** rather than the character: that is what \
Mattermost stores and what its own clients render, so a message written \
here reads the same everywhere and stays editable as text. The server's \
own custom emoji are offered too, and first -- see `posts.custom_emoji`. \
A half-typed `:` completes as well, in both composers, over the same \
machinery the `@` popup uses: two characters at least, which is \
Mattermost's own rule and the one thing that keeps a finished `:tada:` \
from offering the whole table again -- the caret after that last colon is \
the end of a run with nothing in it. The run must also start at a word \
boundary, so the colon in `http://` is not an emoji being typed, and hold \
only shortcode characters, so `:-)` is left alone. Accepting closes the \
shortcode and leaves a space, which is what somebody mid-sentence wants \
next. Verified on a live account: searching "rocket" and picking it put a \
🚀 on the message, and typing `:pep` offered seven of the server's own \
with their pictures, Tab turning it into `:pepe_clap: `. NOT built: \
skin-tone variants."""

[[feature]]
id       = "posts.custom_emoji"
area     = "posts"
upstream = "server-api"
status   = "partial"
endpoints = ["GET /api/v4/emoji", "GET /api/v4/emoji/{emoji_id}/image"]
verified_against = "12.0.1"
notes = """
A server's own uploads. Standard shortcodes resolve against a table \
compiled into the binary; a custom one resolves to an image only the \
server has, and a client that does not fetch the list shows \
`:party_parrot:` where everyone else sees a picture. On the live server \
this was built against that is forty-one emoji, and most of the reactions \
in some channels.

The list is fetched once per sync, sorted by name and capped at a thousand \
-- the default order is creation time, which changes as people upload, so \
paging through it without `sort=name` shows one emoji twice and misses \
another. Images are fetched **per emoji actually drawn**, not up front, and \
cached on disk by id: a name can be freed and re-used for a different \
picture, while re-uploading produces a new id, so the id is the only key \
that cannot go stale. The store holds name to id and never the other way \
round, because a reaction and a typed `:shortcode:` both carry the name.

Drawn on the reaction chips, on the hover toolbar's one-click reactions, \
and in both pickers, where the server's own come before the standard table. \
Anything without a picture -- not custom, not here yet, or a fetch that \
failed -- draws its shortcode, which is what it drew before any of this and \
at least says what was meant. The picker redraws itself as pictures land, \
coalesced: opening it asks for every custom emoji at once and forty answers \
must not be forty rebuilds of the grid.

Verified on a live account with forty-one custom emoji: the picker showed \
shortcodes for a moment and then the pictures, reacting with one put the \
picture on the chip, taking it back removed it, and the cache directory \
held all forty-one afterwards. **Inline in a message too.** A `GtkLabel` cannot do it -- the body is Pango \
markup, which has no way to carry an image -- so a block holding a custom \
emoji is drawn into a `GtkTextView` instead, where the picture goes in as a \
paintable and is laid out as a character is. A paintable rather than a child \
widget on an anchor: a widget occupies the whole line box and leaves a band \
of empty space under the text. The emoji is scaled to the text size when it \
is decoded, because a texture draws at its own size and these are uploaded \
at 128 pixels and more.

**A label everywhere else, on purpose.** A `TextView` carries a buffer, a \
tag table and a layout of its own, and the message list recycles one widget \
set per visible row; making every paragraph one would pay that cost on every \
message to serve the few that need it. Both paths render the same \
`Vec<Inline>` -- the parser hands over an `Inline::Shortcode` for every \
`:name:` it cannot resolve itself -- so they cannot disagree about what the \
message says, and the markup path writes the shortcode back out with its \
colons exactly as before. The `TextView` had to reimplement what the markup \
gave for free: bold, italic, strikethrough, code, links in Mattermost's blue \
with a hand cursor and a click that opens them, and mentions in the same two \
colours -- blue for everyone else's, amber for the reader's own.

One thing had to change for any of it to appear: learning the emoji list now \
forces a redraw. The list arrives *after* the messages that hold it, every \
one of them already drawn as text, and the row comparison that decides what \
to redraw only looks at the row -- so the resolved pictures are part of the \
row now, and a picture landing is what makes the row differ.

Verified on a live account: a message with bold, italic, strikethrough, a \
code span, a link, a mention and three custom emoji drew all of it, in a \
bullet list, in a block quote, and on its own; the link opened in the \
browser; and `:pepe_frog:` inside a fenced code block stayed literal. \
An emoji uploaded while this client is running arrives as `emoji_added` \
over the WebSocket and is known at once, which matters most to the person \
who just uploaded it: without it they would see their own shortcode as \
text until the next sync. NOT built: uploading one."""

[[feature]]
id       = "desktop.install"
area     = "desktop"
upstream = "desktop"
status   = "partial"
endpoints = []
verified_against = ""
notes = """
`cargo xtask install-desktop` puts an icon and a `.desktop` entry in the \
user's own XDG directories: no root, no package manager, and uninstalling is \
deleting two files. That makes it an application the desktop knows about -- \
in the menu, with an icon, and registered for `x-scheme-handler/mattermost`, \
so a `mattermost://` link opens this client. `StartupWMClass` has to match \
the GTK application id or the window never matches its launcher, which shows \
up as a second icon in the dock and no badge, with nothing anywhere saying \
why; all three names come from one constant. The icon is deliberately **not** \
Mattermost's own mark: this is a third-party client and that logo is somebody \
else's trademark. Verified on this machine: the entry installed, and \
`xdg-mime query default x-scheme-handler/mattermost` answers with it. The \
system-wide install is `desktop.package`.

`--autostart` also writes an entry into `~/.config/autostart`, so the client \
starts with the session -- with `--hidden`, which starts it in the tray \
rather than throwing a window at somebody who has just logged in, and with \
`X-GNOME-Autostart-enabled`, which is what GNOME's own Startup Applications \
toggles. Without that key the entry cannot be switched off from the settings \
anybody would look in. A hidden start with **no** tray would be an \
application nobody can reach, and whether a tray appears is not known at \
startup, so the window is hidden immediately and shown again after five \
seconds if no icon has turned up. `--hidden` is also filtered out of the \
arguments GTK sees, because GTK parses argv itself and exits on an option it \
does not know. Verified on this machine: `--hidden` left the process running \
with a tray icon and nothing on screen. The autostart entry itself was \
rendered and unit-tested but not installed here.

A `mattermost://` link is **acted on** now, not just registered for. The \
application takes `HANDLES_OPEN`, so a URL on the command line arrives as \
something to open rather than an error, and `gio::Application` routes a \
second launch to the running instance over D-Bus -- single-instance for \
free, which is why there is no lock file anywhere in this tree. A link \
naming a channel this client has not heard of yet is held and retried on \
every sidebar redraw, because a link that launches the application arrives \
before the channel list does. The binary's own argument parser had to learn \
that a URL is not a subcommand: without that, every link printed "unknown \
command", which is worse than never registering the handler. Verified on \
this machine: with the client already running, \
`mattermost://.../alanbase/channels/town-square` moved it to Town Square and \
the second process exited. NOT verified: the permalink form, which fetches \
the post to learn its channel and then opens the thread -- built and \
unit-tested, but not followed end to end."""

[[feature]]
id       = "desktop.package"
area     = "desktop"
upstream = "desktop"
status   = "partial"
endpoints = []
verified_against = ""
notes = """
`cargo xtask package --out dist --deb` builds an installable `.deb` beside \
the stripped binary and its checksums: the binary in `/usr/bin`, and the \
same icon and `.desktop` entry `install-desktop` writes into the user's own \
directories, rendered from the same function with the installed path in the \
`Exec=` line. By hand with `dpkg-deb` rather than through `cargo-deb`, \
because the package is four files and a control stanza, and a build tool \
that has to be installed before the build works is one more thing between a \
clone and an artefact.

The control stanza is rendered in `mm-desktop`, inside the coverage gate, \
because what a package claims about itself is a decision and a wrong one \
fails at install time on somebody else's machine with a dependency solver's \
error message. GTK, libadwaita and GtkSourceView are `Depends`; the \
dictionaries and the GNOME `AppIndicator` extension are `Recommends`, since \
without them the client still runs -- it just draws no spelling underlines \
and has no tray. Dependencies are named rather than derived with \
`dpkg-shlibdeps`, which wants a full `debian/` tree to run inside. \
`Installed-Size` is measured from the staged tree in kibibytes, which is \
what the field means and is wrong in half the hand-written control files \
anywhere. Every mode is normalised to 0755/0644 after staging, or the \
build machine's umask ships group-writable files into `/usr/share`.

CI builds and inspects the package on every run, not only on a tag: a \
packaging step that runs once a release is a packaging step that is broken \
on the day it matters. A `v*` tag runs `release.yml`, which refuses to go on \
unless the tag and the manifest agree -- otherwise the release's name and \
the binary's `--version` drift apart, and the first person to notice is \
somebody filing a bug against the wrong build -- and leaves a **draft** \
release carrying the binary, the package and `SHA256SUMS`, because the last \
look before something is public belongs to a person.

Verified on this machine: the package builds, `dpkg-deb --info` reads the \
stanza back, the payload is the four expected paths with root ownership and \
standard modes, `desktop-file-validate` passes the entry out of the package, \
and the extracted binary reports its version; `version-check` accepts \
`v0.1.0` and refuses `v9.9.9`. NOT verified: an actual `dpkg -i` and the \
dependency solve, which needs root, and the release workflow itself, which \
has never had a tag to run on. NOT built: an `.rpm`, a Flatpak, and a \
repository to install from."""

[[feature]]
id       = "desktop.badge"
area     = "desktop"
upstream = "desktop"
status   = "partial"
endpoints = []
verified_against = ""
notes = """
The unread mention count on the dock icon, over \
`com.canonical.Unity.LauncherEntry` -- a plain signal on the session bus, \
with no service to own and nothing to register. Ubuntu's dock, Plank, Latte \
and Dash-to-Dock all listen for it; a desktop that does not simply ignores \
it, which is why a failure here goes to the status line and no further. \
Mentions, not unread messages: the count is things addressed to this person, \
and one that counted every unread message would read "412" on a Monday and \
mean nothing. Hidden at zero, because a badge showing "0" reads as something \
to attend to. Sent only when the number moves, not on every redraw. Verified \
on this machine with `dbus-monitor`: the signal carries \
`application://dev.legion.mattermost_rs.desktop` and the right count. NOT \
verified: that the dock draws it, which needed a mention to be waiting and \
is the shell's business rather than this client's."""

[[feature]]
id       = "desktop.keyboard"
area     = "desktop"
upstream = "webapp"
status   = "partial"
endpoints = []
verified_against = "12.0.1"
notes = """
Ctrl+K for the quick switcher, Ctrl+Shift+F for search, Alt+Up and Alt+Down \
to walk the sidebar, Alt+Shift+Up and Alt+Shift+Down to walk only what is \
unread, and Escape to put the thread panel away. Mattermost's own bindings. \
Walking goes over the sidebar's rows rather than the store, because the \
sidebar is what the reader is looking at: already in their order, already \
folded where they folded it, and already filtered if they turned the unread \
filter on -- walking the store instead would step into channels that are not \
on screen. It wraps, which is what makes "previous unread" useful when there \
are two, and it is bounded at one lap so "next unread" with nothing unread \
stops instead of spinning. Every binding is on the window in the capture \
phase, because a `GtkEntry` with the focus eats key presses and the composer \
has the focus nearly always. Verified on a live account: Alt+Down walked \
four channels and wrapped from the bottom of CHANNELS to the top of \
FAVORITES, and Alt+Shift+Down landed on an unread one.

**Up in an empty composer edits the last thing this reader said**, which \
is Mattermost's own binding and the one a daily user reaches for without \
thinking after a typo. Only when the box is empty: that is what the \
webapp does, and it is also what keeps the binding out of the way of \
everything else Up means here -- moving the caret through a message being \
written, and walking either completion popup, whose runs are never empty. \
Each box edits what was last said where it sends, so the thread's own box \
edits the last reply in the thread rather than the last message in the \
channel behind it. A join/leave notice and a webhook's post are skipped: \
they carry this reader's id and there is nothing in them to change. \
Verified on a live account: Up in an empty box opened the editor on the \
last message with its text in it, and Up with two characters typed moved \
the caret instead.

**Shift+Up replies to the last message**, whoever wrote it, which is the \
fastest way into a thread without reaching for the mouse. Empty box only, \
for the same reason: a reader partway through a sentence is selecting text \
with Shift+Up. A join/leave notice is skipped -- that is the server \
talking, and a thread hanging off one is not a conversation. Verified on a \
live account: Shift+Up in an empty box opened the thread panel on the last \
message of the conversation.

Ctrl+/ shows all of it, in GTK's own shortcuts window, which is the only \
way a reader finds out that any of it exists. The list is one hand-kept \
table rather than something derived: the handlers are spread over a \
window controller, two composers and two completion popups, and a table \
that described half of them accurately would be worse than one plainly \
maintained by hand. Verified on a live account: Ctrl+/ drew both groups \
with the right keys on them.

**Ctrl+Shift+\\ reacts to the last message**, Mattermost's own binding: \
it opens the emoji picker on the newest message in the channel, whoever \
wrote it, and picking one toggles the reaction the way the quick \
buttons do. Verified in the lab, by keys faked on its display: the chord \
opened the picker over the box, "tada" typed into its search narrowed \
it, and the server's copy of the newest message carried the reaction. \
NOT built: Alt+Shift+Up/Down across teams."""
