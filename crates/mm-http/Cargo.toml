[package]
name        = "mm-http"
description = "Async transport adapters for mm-api"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[dependencies]
mm-api = { path = "../mm-api" }

# rustls rather than native-tls throughout: it drops a C dependency, keeps the
# .deb's dependency list shorter, and is what makes a static musl build of
# mm-headless possible for the Docker lab.
futures-util      = { version = "0.3", default-features = false, features = ["sink"] }
reqwest           = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
tokio             = { version = "1", features = ["net", "time", "rt"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url               = "2"

[lints]
workspace = true
