[package]
name        = "mm-lab"
description = "Docker integration lab harness and its tests"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[[bin]]
name = "mmlab"
path = "src/bin/mmlab.rs"

[dependencies]
mm-api   = { path = "../mm-api" }
mm-http  = { path = "../mm-http" }
mm-types = { path = "../mm-types" }
serde_json = "1"
tokio      = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
