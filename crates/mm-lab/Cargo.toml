[package]
name        = "mm-lab"
description = "Docker integration lab harness and its tests"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[[bin]]
name = "mmlab"
path = "src/bin/mmlab.rs"

[dependencies]
mm-api   = { path = "../mm-api" }
mm-http  = { path = "../mm-http" }
mm-types = { path = "../mm-types" }
# Pure Rust and safe, so a screenshot on a failed UI test needs no
# `unsafe` -- which the workspace forbids -- and no ImageMagick on the
# runner.
png    = "0.17"
serde_json = "1"
x11rb  = { version = "0.13", features = ["xtest"] }
# The same zbus the tray and the notifications already use. Here it talks
# to the accessibility bus, which is how the UI tests press real buttons
# rather than screen coordinates.
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio      = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
