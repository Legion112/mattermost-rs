[package]
name        = "mm-core"
description = "The client state machine: store, reducers, unread, notification policy"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[dependencies]
mm-api   = { path = "../mm-api" }
mm-types = { path = "../mm-types" }

[dev-dependencies]
# Tests only. Some payloads -- a post's `metadata` -- are opaque JSON in
# `mm-types`, so building one by hand means writing the JSON. Never a
# production dependency of this crate.
serde_json = "1"

[lints]
workspace = true
